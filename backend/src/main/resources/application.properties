spring.application.name=housing-society
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/housing_society?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=ChangeThisSecretKeyToAtLeast32CharactersLongForHS256
app.jwt.expiration-ms=86400000
app.upload-dir=uploads/complaints
